version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: street_photo_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: street_photo_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  minio:
    image: minio/minio:latest
    container_name: street_photo_minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: street_photo_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
  minio_data:
